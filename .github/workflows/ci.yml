name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack browser extension
        id: pack
        run: npm run extension:pack
      - uses: actions/upload-artifact@v4
        with:
          name: pokeroguedex-extension
          path: ${{ steps.pack.outputs.xpi }}
          if-no-files-found: error
