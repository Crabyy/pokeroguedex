name: Release Firefox extension

# Signs extension/ with Mozilla (unlisted, self-distributed) and commits the signed .xpi +
# updates.json into site/extension/ → Vercel redeploys and Firefox users get the update.
# Needs the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Sign with addons.mozilla.org
        id: sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run extension:sign

      - name: Commit
        id: commit
        if: steps.sign.outputs.signed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/extension
          git commit -m "extension: publish signed v${{ steps.sign.outputs.version }}"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy hook
        if: steps.commit.outputs.pushed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
